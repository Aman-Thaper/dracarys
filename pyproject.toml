[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dracarys-dast"
version = "0.1.0"
description = "Evidence-first DAST scanner with verified remediation. Attack. Prove. Fix. Retest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "dast", "scanner", "sast", "sarif", "appsec", "pentest", "vulnerability"]
authors = [{ name = "Aman Thaper", email = "work.aman04@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "SQLAlchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.4",
]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]
postgres = ["asyncpg>=0.29"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/Aman-Thaper/dracarys"
Documentation = "https://github.com/Aman-Thaper/dracarys/blob/main/USAGE.md"
Source = "https://github.com/Aman-Thaper/dracarys"
Changelog = "https://github.com/Aman-Thaper/dracarys/blob/main/CHANGELOG.md"
Issues = "https://github.com/Aman-Thaper/dracarys/issues"

[project.scripts]
dracarys = "dracarys.cli:main"

[tool.setuptools.packages.find]
include = ["dracarys*", "lab*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "e2e: full end-to-end campaign tests",
    "integration: API + database integration tests",
    "evaluation: scored evaluation-harness tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py311"
extend-exclude = ["web", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP042"]  # B008: FastAPI Depends() idiom; UP042: str,Enum is intentional

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
exclude = ["web/", "alembic/", "tests/"]

[tool.coverage.run]
source = ["dracarys", "lab"]
omit = ["*/tests/*"]
