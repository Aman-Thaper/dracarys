# Publish dracarys-dast to PyPI on every published GitHub release.
#
# Uses PyPI Trusted Publishing (OIDC) — there is no API token to store anywhere.
# Register the publisher once at https://pypi.org/manage/account/publishing/ with:
#   PyPI project name : dracarys-dast
#   Owner             : Aman-Thaper
#   Repository        : dracarys
#   Workflow name     : publish-pypi.yml
#   Environment       : pypi
name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
