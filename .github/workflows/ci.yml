name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"
      - name: Lint
        run: ruff check dracarys lab tests
      - name: Migrations apply
        run: alembic upgrade head
        env:
          DRACARYS_DATABASE_URL: sqlite+aiosqlite:///./ci.db
      - name: Test with coverage
        run: pytest --cov=dracarys --cov=lab --cov-report=term-missing --cov-fail-under=80
      - name: Evaluation gate (lab campaign: recall/precision/retest)
        run: dracarys eval
      - name: Scanner generalization gate (independent apps)
        run: dracarys scan-selftest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build (type-check + compile)
        working-directory: web
        run: npm run build
